<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>멤버 목록</title>
</head>
<body>

<h1>멤버 목록</h1>

<table border="1">
    <thead>
    <tr>
        <th>id</th>
        <th>name</th>
    </tr>
    </thead>

    <tbody id="members">
    </tbody>
</table>

<script>
    fetch('/member')
        .then(response => response.json())
        .then(members => {
            const tbody = document.getElementById('members');

            members.forEach(member => {
                tbody.innerHTML += `
                    <tr>
                        <td>${member.id}</td>
                        <td>${member.name}</td>
                    </tr>
                `;
            });
        });
</script>

</body>
</html>
